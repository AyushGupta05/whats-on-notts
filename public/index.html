<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151617" />
    <title>What’s On Notts · University of Nottingham events</title>
    <meta
      name="description"
      content="Find University of Nottingham society socials, sports, careers events and workshops. Browse by date, society and activity."
    />
    <link rel="canonical" href="https://whatsonnotts.com/" />
    <meta property="og:title" content="What’s On Notts · Campus events" />
    <meta
      property="og:description"
      content="Society socials, workshops, careers and sport at the University of Nottingham."
    />
    <meta
      property="og:image"
      content="https://whatsonnotts.com/assets/profile.png"
    />
    <link rel="icon" href="assets/profile.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="nav">
        <a class="brand" href="./"
          ><img src="assets/avatar.svg" alt="" />What’s On Notts</a
        >
        <nav aria-label="Main navigation">
          <button data-view="events">Events</button>
          <button data-view="organisers">Groups</button>
        </nav>
      </div>
    </header>
    <main class="calendar">
      <aside class="identity" aria-label="Calendar location">
        <img
          class="cover"
          src="assets/university-park.webp"
          alt="Illustration of the Trent Building across Highfields Lake"
          width="480"
          height="480"
        />
        <p class="location">University Park, Nottingham</p>
      </aside>
      <div class="feed">
        <div class="feed-heading">
          <h1 id="title">Campus events</h1>
          <span id="count" aria-live="polite"></span>
        </div>
        <section class="controls" aria-label="Browse events">
          <div class="searchrow">
            <label class="search"
              ><span class="search-icon" aria-hidden="true"></span
              ><input
                id="query"
                type="search"
                aria-label="Search events or groups"
                placeholder="Search events or societies"
            /></label>
            <button
              type="button"
              class="filter-toggle"
              id="filtertoggle"
              aria-expanded="false"
              aria-controls="filterpanel"
            >
              Filters
            </button>
          </div>
          <div class="tabs" role="group" aria-label="Organiser type">
            <button type="button" data-kind="">All</button
            ><button type="button" data-kind="Societies">Societies</button
            ><button type="button" data-kind="Sports">Sport</button
            ><button type="button" data-kind="Careers">Careers</button
            ><button type="button" data-kind="University">University</button>
          </div>
          <div class="quick" role="group" aria-label="Date">
            <button type="button" class="chip event-only" data-when="today">Today</button
            ><button type="button" class="chip event-only" data-when="weekend">Weekend</button
            ><button type="button" class="chip event-only" data-when="week">This week</button>
          </div>
          <div class="active-filters" id="active" hidden></div>

          <!-- Filter state; the visible tabs, chips and sheet drive these -->
          <div hidden>
            <select id="kind"></select>
            <select id="when">
              <option value="">Any date</option>
              <option value="today">Today</option>
              <option value="week">Next 7 days</option>
              <option value="weekend">This weekend</option>
              <option value="date">Choose date</option>
            </select>
            <select id="activity">
              <option value="">All activities</option>
              <option>Social</option>
              <option>Workshop</option>
              <option>Talk</option>
              <option>Sport</option>
              <option>Performance</option>
              <option>Other</option>
            </select>
          </div>

          <div class="scrim" id="scrim" hidden></div>
          <div
            class="sheet"
            id="filterpanel"
            role="dialog"
            aria-labelledby="sheet-title"
            hidden
          >
            <div class="sheet-head">
              <h2 id="sheet-title">Filters</h2>
              <button type="button" class="close" id="sheetclose" aria-label="Close filters">✕</button>
            </div>
            <fieldset class="event-only">
              <legend>Activity</legend>
              <div class="pills">
                <button type="button" class="chip" data-activity="">Any</button
                ><button type="button" class="chip" data-activity="Social">Social</button
                ><button type="button" class="chip" data-activity="Workshop">Workshop</button
                ><button type="button" class="chip" data-activity="Talk">Talk</button
                ><button type="button" class="chip" data-activity="Sport">Sport</button
                ><button type="button" class="chip" data-activity="Performance">Performance</button>
              </div>
            </fieldset>
            <label class="field">Organiser<select id="org"></select></label>
            <label class="field">Subject or interest<select id="topic"></select></label>
            <label class="field event-only">On a specific day<input type="date" id="date" /></label>
            <div class="sheet-foot">
              <button type="button" id="reset">Clear all</button>
              <button type="button" class="apply" id="apply">Show events</button>
            </div>
          </div>
        </section>

        <label id="review-groups" hidden><input type="checkbox" id="include-unverified" /> Include groups awaiting activity verification</label>
        <div id="list">
          <p>Loading events…</p>
          <noscript><a href="events.html">Browse event listings</a></noscript>
        </div>
        <button id="more" hidden>Show more ↓</button>
      </div>
    </main>
    <footer>
      <a href="events.html">Event index</a><span id="updated"></span>
    </footer>
  </body>
</html>
