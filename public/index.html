<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171817" />
    <title>What’s On Notts · University of Nottingham events</title>
    <meta
      name="description"
      content="Find University of Nottingham society socials, sports, careers events and workshops. Browse by date, society and activity."
    />
    <link rel="canonical" href="https://whatsonnotts.com/" />
    <meta property="og:title" content="What’s On Notts · Campus events" />
    <meta
      property="og:description"
      content="Society socials, workshops, careers and sport at the University of Nottingham."
    />
    <meta
      property="og:image"
      content="https://whatsonnotts.com/assets/profile.png"
    />
    <link rel="icon" href="assets/profile.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="nav">
        <a class="brand" href="./"
          ><img src="assets/avatar.svg" alt="" />What’s On Notts</a
        >
        <nav aria-label="Main navigation">
          <button data-view="events">Events</button
          ><button data-view="organisers">Groups</button
          ><button data-view="saved">
            Saved <span id="savedcount"></span>
          </button>
        </nav>
      </div>
    </header>
    <main>
      <section class="mast">
        <div>
          <p>University of Nottingham</p>
          <h1 id="title">Society diary</h1>
        </div>
        <img src="assets/flag.svg" alt="" />
      </section>
      <section class="controls" aria-label="Browse events">
        <label class="search"
          ><span aria-hidden="true">⌕</span
          ><input
            id="query"
            type="search"
            aria-label="Search events or groups"
            placeholder="Search an event or society"
        /></label>
        <div class="choices">
          <label>Organiser<select id="kind"></select></label>
          <label class="event-only"
            >Date<select id="when">
              <option value="">Any date</option>
              <option value="today">Today</option>
              <option value="week">Next 7 days</option>
              <option value="weekend">This weekend</option>
              <option value="date">Choose date</option>
            </select></label
          >
          <input type="date" id="date" aria-label="Choose date" hidden />
          <label class="event-only"
            >Activity<select id="activity">
              <option value="">All activities</option>
              <option>Social</option>
              <option>Workshop</option>
              <option>Talk</option>
              <option>Sport</option>
              <option>Performance</option>
              <option>Other</option>
            </select></label
          >
          <details id="filters">
            <summary>More filters</summary>
            <div>
              <label>Subject or interest<select id="topic"></select></label
              ><label>Group<select id="org"></select></label>
            </div>
          </details>
          <button id="reset">Reset</button>
        </div>
      </section>
      <div class="summary" id="count" aria-live="polite"></div>
      <div id="list">
        <p>Loading events…</p>
        <noscript><a href="events.html">Browse event listings</a></noscript>
      </div>
      <button id="more" hidden>Show more ↓</button>
    </main>
    <footer>
      <a href="events.html">Event index</a><span id="updated"></span>
    </footer>
  </body>
</html>
